version: "3.8"

services:
  aspid-frontend:
    image: aspid-frontend:v1.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: aspid-frontend-app
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    env_file:
      - .env
    networks:
      - aspid_network

networks:
  aspid_network:
    external: true
    name: red_global_aspid
